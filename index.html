<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>DREAM WORLD: 3D Open-World Adventure</title>
    <meta name="description" content="A high-fidelity third-person 3D open-world game set in a vibrant world inspired by Bangladesh, featuring detailed rigged human characters, interactive vehicles, quests, dynamic weather, and continuous seamless exploration." />
    <meta name="theme-color" content="#020617" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="DreamWorld" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <meta property="og:title" content="DREAM WORLD: 3D Open-World Adventure" />
    <meta property="og:description" content="A high-fidelity third-person 3D open-world game set in a vibrant world inspired by Bangladesh, featuring detailed rigged human characters, interactive vehicles, quests, dynamic weather, and continuous seamless exploration." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      // Gracefully prevent benign Vite HMR WebSocket closing events in iframe preview (HMR is disabled in this environment)
      (function () {
        // 1. Filter benign Vite HMR console errors
        const originalConsoleError = console.error;
        console.error = function (...args) {
          const first = args[0];
          const text = (first && (first.message || first.stack)) ? String(first.message || first.stack) : args.join(' ');
          if (text.includes('WebSocket closed without opened') || (text.includes('[vite]') && text.includes('WebSocket'))) {
            return;
          }
          originalConsoleError.apply(console, args);
        };

        // 2. Intercept Vite HMR WebSocket client so it never attempts handshake failures
        const OriginalWebSocket = window.WebSocket;
        if (OriginalWebSocket) {
          window.WebSocket = new Proxy(OriginalWebSocket, {
            construct(target, args) {
              const url = args[0];
              const protocols = args[1];
              const isViteHmr = protocols === 'vite-hmr' ||
                (Array.isArray(protocols) && protocols.includes('vite-hmr')) ||
                (typeof url === 'string' && (url.includes('vite-hmr') || url.includes('/@vite/client')));

              if (isViteHmr) {
                const dummyTarget = new EventTarget();
                return {
                  readyState: 1,
                  CONNECTING: 0,
                  OPEN: 1,
                  CLOSING: 2,
                  CLOSED: 3,
                  url: String(url),
                  protocol: 'vite-hmr',
                  bufferedAmount: 0,
                  extensions: '',
                  binaryType: 'blob',
                  send: function () {},
                  close: function () {},
                  addEventListener: dummyTarget.addEventListener.bind(dummyTarget),
                  removeEventListener: dummyTarget.removeEventListener.bind(dummyTarget),
                  dispatchEvent: dummyTarget.dispatchEvent.bind(dummyTarget),
                  onopen: null,
                  onclose: null,
                  onerror: null,
                  onmessage: null,
                };
              }
              return Reflect.construct(target, args);
            }
          });
        }

        // 3. Catch any remaining window error events
        window.addEventListener('error', function (event) {
          const msg = event?.message || event?.error?.message || '';
          if (typeof msg === 'string' && (msg.includes('WebSocket') || msg.includes('[vite]'))) {
            event.stopImmediatePropagation();
            event.preventDefault();
            return true;
          }
        }, true);
        window.addEventListener('unhandledrejection', function (event) {
          const msg = event?.reason?.message || event?.reason || '';
          if (typeof msg === 'string' && (msg.includes('WebSocket') || msg.includes('[vite]'))) {
            event.stopImmediatePropagation();
            event.preventDefault();
          }
        }, true);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
