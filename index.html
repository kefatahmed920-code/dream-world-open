<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>DREAM WORLD: 3D Open-World Adventure</title>
    <meta name="description" content="A high-fidelity third-person 3D open-world game set in a vibrant world inspired by Bangladesh, featuring detailed rigged human characters, interactive vehicles, quests, dynamic weather, and continuous seamless exploration." />
    <meta name="theme-color" content="#020617" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="DreamWorld" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <meta property="og:title" content="DREAM WORLD: 3D Open-World Adventure" />
    <meta property="og:description" content="A high-fidelity third-person 3D open-world game set in a vibrant world inspired by Bangladesh, featuring detailed rigged human characters, interactive vehicles, quests, dynamic weather, and continuous seamless exploration." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      // Gracefully prevent benign Vite HMR WebSocket closing events from bubbling in iframe preview
      window.addEventListener('error', function (event) {
        if (event && (
          (typeof event.message === 'string' && (event.message.includes('WebSocket') || event.message.includes('[vite]'))) ||
          (event.error && typeof event.error.message === 'string' && (event.error.message.includes('WebSocket') || event.error.message.includes('[vite]')))
        )) {
          event.stopImmediatePropagation();
          event.preventDefault();
          return true;
        }
      }, true);
      window.addEventListener('unhandledrejection', function (event) {
        if (event && event.reason && typeof event.reason.message === 'string' && (event.reason.message.includes('WebSocket') || event.reason.message.includes('[vite]'))) {
          event.stopImmediatePropagation();
          event.preventDefault();
        }
      }, true);
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
