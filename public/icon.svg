<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#022c22" />
      <stop offset="50%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  
  <!-- Outer Ring Accent -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="url(#goldGrad)" stroke-width="6" opacity="0.4" />
  <circle cx="256" cy="256" r="190" fill="none" stroke="#10b981" stroke-width="2" stroke-dasharray="8 6" opacity="0.6" />

  <!-- Stylized Mountain & River Bridge Glyph -->
  <!-- Mountain Silhouette -->
  <polygon points="120,340 220,180 300,300 370,210 420,340" fill="#047857" opacity="0.7" />
  <polygon points="160,340 256,150 350,340" fill="url(#emeraldGrad)" filter="url(#shadow)" />
  
  <!-- Padma River Ribbon -->
  <path d="M 100,380 Q 256,320 412,380 L 412,410 Q 256,350 100,410 Z" fill="#0284c7" opacity="0.85" />
  
  <!-- Compass Star / Jewel -->
  <polygon points="256,90 270,140 320,154 270,168 256,218 242,168 192,154 242,140" fill="url(#goldGrad)" filter="url(#shadow)" />

  <!-- Bengali Calligraphy & Title Badge -->
  <circle cx="256" cy="256" r="28" fill="#e11d48" opacity="0.9" />
  
  <!-- Title Text -->
  <text x="256" y="445" font-family="'Segoe UI', Arial, sans-serif" font-weight="900" font-size="34" fill="#f8fafc" letter-spacing="4" text-anchor="middle">
    DREAM WORLD
  </text>
  <text x="256" y="475" font-family="'Segoe UI', Arial, sans-serif" font-weight="700" font-size="18" fill="#34d399" letter-spacing="2" text-anchor="middle">
    স্বপ্নের ভুবন
  </text>
</svg>
